<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seed Loom Graph Workbench</title><style>body{margin:0;font:14px system-ui;background:#111;color:#eee}header{display:flex;gap:12px;padding:12px;border-bottom:1px solid #333}input,select{background:#1b1b1b;color:#eee;border:1px solid #444;padding:8px}main{display:grid;grid-template-columns:1fr 360px;height:calc(100vh - 58px)}svg{width:100%;height:100%;background:#151515}.panel{overflow:auto;padding:14px;border-left:1px solid #333}circle{stroke:#fff;stroke-width:1;cursor:pointer}line{stroke:#555;stroke-opacity:.65}text{fill:#ddd;font-size:10px;pointer-events:none}.muted{color:#999}pre{white-space:pre-wrap;font-size:11px}.badge{display:inline-block;padding:3px 7px;border:1px solid #555;border-radius:10px;margin:2px}</style></head><body><header><strong>Seed Loom Graph Workbench</strong><input id="q" placeholder="Search nodes, fields, paths"><select id="type"><option value="">All types</option></select><span id="stats" class="muted"></span></header><main><svg id="graph"></svg><aside class="panel"><div id="detail">Select a node to inspect provenance, fields, neighbors, confidence, and file path.</div></aside></main><script type="module">const data=await fetch('./data.json').then(r=>r.json());const svg=document.querySelector('#graph'),detail=document.querySelector('#detail'),q=document.querySelector('#q'),type=document.querySelector('#type'),stats=document.querySelector('#stats');const types=[...new Set(data.nodes.map(n=>n.type))].sort();for(const t of types)type.add(new Option(t,t));const color=t=>({Source:'#5aa9e6',Observation:'#f7b267',Actor:'#70c1b3',Relationship:'#b388eb',ResearchRun:'#ff6b6b',Run:'#ff6b6b',Receipt:'#c7d36f',Pattern:'#f25f5c',Opportunity:'#ffe066',Strategy:'#9b5de5',Experiment:'#00bbf9',Repository:'#adb5bd',Unresolved:'#555'}[t]||'#ddd');function render(){svg.innerHTML='';const term=q.value.toLowerCase(),kind=type.value;const nodes=data.nodes.filter(n=>(!kind||n.type===kind)&&(!term||JSON.stringify(n).toLowerCase().includes(term)));const ids=new Set(nodes.map(n=>n.id));const edges=data.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));const w=svg.clientWidth,h=svg.clientHeight,cx=w/2,cy=h/2,r=Math.max(120,Math.min(w,h)*.38);const pos=new Map(nodes.map((n,i)=>[n.id,{x:cx+r*Math.cos(i/nodes.length*Math.PI*2),y:cy+r*Math.sin(i/nodes.length*Math.PI*2)}]));for(const e of edges){const a=pos.get(e.from),b=pos.get(e.to);svg.insertAdjacentHTML('beforeend',`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${e.predicate}</title></line>`)}for(const n of nodes){const p=pos.get(n.id);const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="${8+Math.min(8,edges.filter(e=>e.from===n.id||e.to===n.id).length)}" fill="${color(n.type)}"><title>${n.id}</title></circle><text x="${p.x+12}" y="${p.y+4}">${n.label.slice(0,34)}</text>`;g.onclick=()=>inspect(n);svg.append(g)}stats.textContent=`${nodes.length} nodes · ${edges.length} edges · ${data.sha256.slice(0,10)}`;}function inspect(n){const neighbors=data.edges.filter(e=>e.from===n.id||e.to===n.id);detail.innerHTML=`<h2>${n.label}</h2><span class="badge">${n.type}</span>${n.status?`<span class="badge">${n.status}</span>`:''}<p><b>ID</b><br>${n.id}</p><p><b>Canonical path</b><br>${n.path||'generated/unresolved'}</p><p><b>Confidence</b><br>${n.confidence??'not assigned'}</p><h3>Relationships (${neighbors.length})</h3>${neighbors.map(e=>`<div>${e.from===n.id?'→':'←'} <b>${e.predicate}</b> ${e.from===n.id?e.to:e.from}</div>`).join('')}<h3>Record</h3><pre>${escapeHtml(JSON.stringify(n.record,null,2))}</pre>`}function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}q.oninput=type.onchange=render;render();</script></body></html>
