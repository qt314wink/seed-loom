<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seed Loom Graph Workbench</title>
<style>body{margin:0;font:14px system-ui;background:#111;color:#eee}header{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid #333;flex-wrap:wrap}input,select{background:#1b1b1b;color:#eee;border:1px solid #444;padding:8px}main{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:calc(100vh - 72px)}svg{width:100%;height:100%;background:#151515}.panel{overflow:auto;padding:14px;border-left:1px solid #333}.summary{display:flex;gap:8px;flex-wrap:wrap}.card{padding:7px 9px;border:1px solid #3c3c3c;border-radius:8px;background:#181818}circle{stroke:#fff;stroke-width:1;cursor:pointer}line{stroke:#555;stroke-opacity:.65}text{fill:#ddd;font-size:10px;pointer-events:none}.muted{color:#999}pre{white-space:pre-wrap;font-size:11px}.badge{display:inline-block;padding:3px 7px;border:1px solid #555;border-radius:10px;margin:2px}.warning{border-color:#a76;color:#fcb}.canonical{border-color:#5aa9e6}.projection{border-color:#b388eb}@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}.panel{border-left:0;border-top:1px solid #333}}</style></head>
<body><header><strong>Seed Loom Graph Workbench</strong><input id="q" placeholder="Search control outputs, claims, paths"><select id="type"><option value="">All types</option></select><select id="scope"><option value="">Canonical + projections</option><option value="canonical">Canonical only</option><option value="projection">Generated controls only</option></select><span id="stats" class="muted"></span></header>
<div id="summary" class="summary" style="padding:8px 12px;border-bottom:1px solid #333"></div><main><svg id="graph"></svg><aside class="panel"><div id="detail">Select a node to inspect provenance, control state, review queues, confidence, and canonical boundaries.</div></aside></main>
<script type="module">const data=await fetch('./data.json').then(r=>r.json());const svg=document.querySelector('#graph'),detail=document.querySelector('#detail'),q=document.querySelector('#q'),type=document.querySelector('#type'),scope=document.querySelector('#scope'),stats=document.querySelector('#stats'),summary=document.querySelector('#summary');const types=[...new Set(data.nodes.map(n=>n.type))].sort();for(const t of types)type.add(new Option(t,t));const d=data.demonstrations||{};summary.innerHTML=Object.entries(d).map(([k,v])=>`<span class="card ${String(k).includes('Review')?'warning':''}"><b>${k}</b> ${v}</span>`).join('');const color=t=>({Source:'#5aa9e6',Observation:'#f7b267',Actor:'#70c1b3',Relationship:'#b388eb',ResearchRun:'#ff6b6b',Run:'#ff6b6b',Receipt:'#c7d36f',Pattern:'#f25f5c',Opportunity:'#ffe066',Strategy:'#9b5de5',Experiment:'#00bbf9',Projection:'#b388eb',Candidate:'#ff9f1c',QuarantineRecord:'#e76f51',ReviewQueueItem:'#f4a261',Unresolved:'#555'}[t]||'#ddd');function render(){svg.innerHTML='';const term=q.value.toLowerCase(),kind=type.value,sc=scope.value;const nodes=data.nodes.filter(n=>(!kind||n.type===kind)&&(!sc||(sc==='canonical'?n.canonical:!n.canonical))&&(!term||JSON.stringify(n).toLowerCase().includes(term)));const ids=new Set(nodes.map(n=>n.id));const edges=data.edges.filter(e=>ids.has(e.from)&&ids.has(e.to));const w=svg.clientWidth,h=svg.clientHeight,cx=w/2,cy=h/2,r=Math.max(120,Math.min(w,h)*.38);const pos=new Map(nodes.map((n,i)=>[n.id,{x:cx+r*Math.cos(i/Math.max(1,nodes.length)*Math.PI*2),y:cy+r*Math.sin(i/Math.max(1,nodes.length)*Math.PI*2)}]));for(const e of edges){const a=pos.get(e.from),b=pos.get(e.to);svg.insertAdjacentHTML('beforeend',`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${e.predicate}</title></line>`)}for(const n of nodes){const p=pos.get(n.id);const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="${8+Math.min(8,edges.filter(e=>e.from===n.id||e.to===n.id).length)}" fill="${color(n.type)}"><title>${n.id}</title></circle><text x="${p.x+12}" y="${p.y+4}">${escapeHtml(n.label.slice(0,34))}</text>`;g.onclick=()=>inspect(n);svg.append(g)}stats.textContent=`${nodes.length} nodes · ${edges.length} edges · ${data.sha256.slice(0,10)}`;}function inspect(n){const neighbors=data.edges.filter(e=>e.from===n.id||e.to===n.id);detail.innerHTML=`<h2>${escapeHtml(n.label)}</h2><span class="badge">${n.type}</span><span class="badge ${n.canonical?'canonical':'projection'}">${n.canonical?'canonical JSON':'disposable projection'}</span>${n.control?`<span class="badge">${n.control}</span>`:''}${n.status?`<span class="badge">${n.status}</span>`:''}<p><b>ID</b><br>${escapeHtml(n.id)}</p><p><b>Path</b><br>${escapeHtml(n.path||'generated/unresolved')}</p><p><b>Confidence</b><br>base ${n.baseConfidence??n.confidence??'not assigned'} · effective ${n.effectiveConfidence??'not projected'}</p><p><b>Classification</b><br>${n.dataClassification??'not assigned'}</p><p><b>Notebook origin</b><br>${n.notebookOrigin??'none'}</p><h3>Review queue (${(n.reviewQueue||[]).length})</h3>${(n.reviewQueue||[]).map(x=>`<div class="card warning">${escapeHtml(x)}</div>`).join('')||'<p class="muted">None</p>'}<h3>Relationships (${neighbors.length})</h3>${neighbors.map(e=>`<div>${e.from===n.id?'→':'←'} <b>${e.predicate}</b> ${escapeHtml(e.from===n.id?e.to:e.from)}</div>`).join('')}<h3>Record</h3><pre>${escapeHtml(JSON.stringify(n.record,null,2))}</pre>`}function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}q.oninput=type.onchange=scope.onchange=render;render();</script></body></html>
