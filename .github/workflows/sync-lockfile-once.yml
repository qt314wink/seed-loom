name: Sync Lockfile Once
on:
  push:
    branches:
      - feat/strategy-genesis-engine-v0
    paths:
      - package.json
      - .github/workflows/sync-lockfile-once.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-genesis-engine-v0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate the frozen npm lockfile only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only the synchronized lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: synchronize lockfile for knowledge controls'
          git push origin HEAD:feat/strategy-genesis-engine-v0
