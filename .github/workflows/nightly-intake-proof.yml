name: Nightly Intake Proof

on:
  pull_request:
    paths:
      - 'ops/nightly-intake/**'
      - 'scripts/knowledge/ingest-nightly-run.mjs'
      - 'scripts/knowledge/normalize-nightly-bundle.mjs'
      - 'scripts/knowledge/prove-nightly-ingest.mjs'
      - 'knowledge/schema/**'
      - '.github/workflows/nightly-intake-proof.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run two isolated nightly proofs
        run: npm run knowledge:prove-nightly -- --out=nightly-intake-proof.json
      - name: Upload machine-readable proof
        uses: actions/upload-artifact@v4
        with:
          name: nightly-intake-proof
          path: nightly-intake-proof.json
          if-no-files-found: error
          retention-days: 14
