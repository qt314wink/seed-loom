name: Visual Regression

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate Linux baselines and upload them for review'
        required: false
        default: false
        type: boolean

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run visual regression suite
        run: |
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            npm run test:visual -- --update-snapshots
          else
            npm run test:visual
          fi
      - name: Upload regenerated Linux baselines
        if: ${{ inputs.update_snapshots == true }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 14
