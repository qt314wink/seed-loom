name: Visual Baseline Maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the current application
        run: npm run build
      - name: Regenerate Linux visual baselines
        run: npm run test:visual -- --update-snapshots
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
          retention-days: 7
