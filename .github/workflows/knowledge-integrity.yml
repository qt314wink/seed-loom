name: Knowledge Integrity

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'protocols/**'
      - 'scripts/knowledge/**'
      - 'docs/strategy-genesis/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/knowledge-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Setup knowledge directories
        run: npm run knowledge:setup
      - name: Verify knowledge pipeline
        run: npm run knowledge:verify
      - name: Repeat deterministic verification
        run: npm run knowledge:verify
      - name: Upload generated receipts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-failure-receipts
          path: |
            knowledge/receipts/**
            knowledge/indexes/**
          if-no-files-found: ignore
          retention-days: 7
