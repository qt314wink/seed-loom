name: Refresh remediated visual baselines

# One-shot branch utility. Remove after the reviewed baselines are committed.
on:
  push:
    branches:
      - feat/filter-atelier-authoring-v0.2

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'chore: refresh remediated visual baselines'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Report baseline refresh run
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 25,
              body: `Visual baseline refresh run ${context.runId} started for ${context.sha}.`
            })
      - uses: actions/checkout@v4
        with:
          ref: feat/filter-atelier-authoring-v0.2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:visual:update
      - name: Commit reviewed Linux baselines
        run: |
          set -euo pipefail
          git add tests/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo 'Visual baselines already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: update remediated visual baselines'
          git push --force-with-lease origin HEAD:feat/filter-atelier-authoring-v0.2
