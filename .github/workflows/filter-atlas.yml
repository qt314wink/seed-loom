name: Filter Atlas and Atelier

on:
  pull_request:
    paths:
      - "packages/svg-filter-atlas/**"
      - "src/filter-atlas.ts"
      - "src/filter-atelier/**"
      - "src/main.ts"
      - "tests/filter-atelier.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/filter-atlas.yml"

  push:
    branches: [main]
    paths:
      - "packages/svg-filter-atlas/**"
      - "src/filter-atlas.ts"
      - "src/filter-atelier/**"
      - "src/main.ts"
      - "tests/filter-atelier.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/filter-atlas.yml"

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build
        run: npm run check

  atelier-browser-tests:
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Atelier browser tests
        run: npm run test:visual -- tests/filter-atelier.spec.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: filter-atelier-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
